name: Infrastructure checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history -m' --redact --no-banner

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test deployment behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check shell scripts
        run: |
          bash -n bin/bootstrap bin/portfolio-ssh
          shellcheck -e SC1091 bin/bootstrap bin/portfolio-ssh
      - name: Validate Compose
        env:
          APP_BLUE_IMAGE: ghcr.io/bartkozik/kozikowski-it:check
          APP_GREEN_IMAGE: ghcr.io/bartkozik/kozikowski-it:check
        run: docker compose config --quiet
