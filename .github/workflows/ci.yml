name: Infrastructure checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test deployment behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check shell scripts
        run: |
          bash -n bin/bootstrap bin/portfolio-ssh
          shellcheck -e SC1091 bin/bootstrap bin/portfolio-ssh
      - name: Validate Compose
        env:
          APP_BLUE_IMAGE: ghcr.io/bartkozik/kozikowski-it:check
          APP_GREEN_IMAGE: ghcr.io/bartkozik/kozikowski-it:check
        run: docker compose config --quiet
