name: Caddy image

on:
  pull_request:
    paths: [caddy/Dockerfile, tests/caddy_image.py, .github/workflows/caddy-image.yml]
  push:
    branches: [main]
    paths: [caddy/Dockerfile, tests/caddy_image.py, .github/workflows/caddy-image.yml]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test Caddy
        run: |
          docker build -f caddy/Dockerfile --tag "ghcr.io/$GITHUB_REPOSITORY/caddy:sha-$GITHUB_SHA" caddy
          python3 tests/caddy_image.py "ghcr.io/$GITHUB_REPOSITORY/caddy:sha-$GITHUB_SHA"
          docker save "ghcr.io/$GITHUB_REPOSITORY/caddy:sha-$GITHUB_SHA" | gzip > "$RUNNER_TEMP/caddy.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: caddy-image
          path: ${{ runner.temp }}/caddy.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: caddy-image
          path: ${{ runner.temp }}/image
      - name: Publish tested Caddy image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gzip --decompress --stdout "$RUNNER_TEMP/image/caddy.tar.gz" | docker load
          image="ghcr.io/$GITHUB_REPOSITORY/caddy:sha-$GITHUB_SHA"
          docker push "$image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
